[package]
name = "dynamo-g2direct"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Direct peer transport for engine-owned host KV caches"

[features]
default = ["transport"]
transport = ["dep:dashmap", "dep:dynamo-memory", "dep:dynamo-runtime", "dep:nixl-sys", "dep:rayon", "dep:rmp-serde", "dep:xxhash-rust"]

[dependencies]
anyhow = { workspace = true }
dynamo-tokens = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true, optional = true }
dynamo-memory = { workspace = true, optional = true }
dynamo-runtime = { workspace = true, optional = true }
nixl-sys = { version = "=1.4.0", optional = true }
rayon = { version = "1", optional = true }
rmp-serde = { workspace = true, optional = true }
xxhash-rust = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
