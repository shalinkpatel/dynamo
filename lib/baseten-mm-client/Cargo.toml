[package]
name = "baseten-mm-client"
description = "Rust HTTP client for Baseten multimodal encoders"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
baseten_performance_client_core = { version = "=0.1.13-post.1", default-features = false, features = ["rustls"] }
blake3 = { workspace = true }
dynamo-multimodal = { git = "https://github.com/ai-dynamo/frontend-crates", rev = "17020c2662a490f4366d1710db1971776d4e63b5", default-features = false }
futures = { workspace = true }
image = { version = "0.25", default-features = false }
ipnet = { workspace = true }
reqwest = { workspace = true }
rmpv = { version = "1", features = ["with-serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
rmp-serde = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
