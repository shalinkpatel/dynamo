[package]
name = "baseten-parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Request-scoped Baseten adapters for upstream Dynamo streaming parsers"

[dependencies]
anyhow.workspace = true
futures.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
dynamo-parsers-v1 = { package = "dynamo-parsers", version = "=11.0.2", git = "https://github.com/ai-dynamo/frontend-crates.git", rev = "b4dbde79626e8182f78ba5abc5a6cdb962564d9a" }
vllm-parser = { git = "https://github.com/vllm-project/vllm.git", rev = "f84325c48c0acc1e3703103788c5f2976e719762" }
vllm-tokenizer = { git = "https://github.com/vllm-project/vllm.git", rev = "f84325c48c0acc1e3703103788c5f2976e719762" }
dynamo-parsers-v2 = { version = "=0.9.7", git = "https://github.com/ai-dynamo/frontend-crates.git", rev = "b4dbde79626e8182f78ba5abc5a6cdb962564d9a" }
