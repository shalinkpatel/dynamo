syntax = "proto3";

package dynamo.b10.generation.v1;

import "google/protobuf/empty.proto";

// Source of truth for generated Rust messages and cross-language clients.
// Generation HTTP responses are a sequence of messages prefixed by a
// four-byte big-endian message length.
//
// This compact numbering is the initial production baseline. Once deployed,
// preserve field numbers and types and enum values. Add new fields and values
// with unused numbers; reserve removed numbers and names. Incompatible changes
// require a new protocol version.

// POST /v1/bid is unary protobuf in both directions, without stream framing.
message BidRequest
{
  repeated uint32 tokens = 1 [packed = true];
  // Required for multimodal requests; may be omitted for text-only requests.
  optional MmRoutingArgs mm_routing_args = 2;
  // Preserved by coordinator relays; router bids do not yet use cache_salt.
  optional string cache_salt = 3;
  // Same key as Routing.session_id; the downstream owns affinity decisions.
  optional string session_id = 4;
}

message BidResponse
{
  bool affinity = 1;
  uint64 prefill_tokens = 2;
  uint64 decode_tokens = 3;
}

// Alyx owns generation streams and consults GWP for placement and
// attempt accounting. NewRequest and GenerationResponseFrame stay on the
// generation path; worker payloads and output chunks are not sent to GWP.
//
// Alyx pins CommitIntend, ResponseOpenOutcome, and ResponseFinish for one attempt
// to the same GWP replica, including retries. Locate does not establish ownership.
// Mutation acknowledgements mean the notification was accepted, including an
// identical duplicate or an event retained for later reconciliation. They do
// not guarantee downstream admission or durable storage. Invalid messages and
// conflicting reuse of an attempt ID return an error.
//
// Denial, opening failure, ResponseFinish, and booking expiry are terminal. Each
// releases any remaining load once and retains a tombstone, even if CommitIntend
// has not arrived. Late notifications must never recreate active load. Terminal
// records must survive the configured notification replay window; Alyx must stop
// retries within that window.
service KVLocatorService
{
  // Read-only: retains no attempt, books no load, and does not refresh affinity.
  // Returns every eligible placement with its score for each supported requested
  // version so Alyx can compare versions and choose one placement to commit.
  // The call deadline is the lookup budget; Alyx treats a late answer as a miss.
  rpc Locate(LocateRequest) returns (LocateResponse);

  // Books Alyx's chosen placement once. The same payload may be retried with
  // the same attempt_id without adding load or extending the booking TTL.
  // Does not require an earlier successful Locate. Abandoned bookings expire
  // on GWP's own TTL; an already-finished attempt must not be booked again.
  rpc CommitIntend(CommitIntendRequest) returns (google.protobuf.Empty);

  // Admission reconciles provisional load with the actual workers and keeps the
  // attempt active until ResponseFinish. Denial or opening failure terminates
  // the attempt immediately; Alyx sends no ResponseFinish for those outcomes.
  // An outcome arriving before CommitIntend is retained. Confirmed admission
  // can update prefix/affinity information, including after termination, but
  // must never recreate active load for a terminal attempt.
  rpc ResponseOpenOutcome(ResponseOpenOutcomeRequest) returns (google.protobuf.Empty);

  // Terminates a previously admitted response on completion, cancellation, or
  // stream failure. Alyx sends this only after observing an Admission frame.
  // Delivery may precede ResponseOpenOutcome or CommitIntend; GWP applies the
  // terminal transition immediately without waiting for either notification.
  rpc ResponseFinish(ResponseFinishRequest) returns (google.protobuf.Empty);
}

message LocateRequest
{
  // Required canonical model/deployment identity resolved by trusted ingress.
  string model_id = 1;
  // Required. Carries tokens, MM routing information, cache salt, and session ID.
  BidRequest bid = 2;
  // Authoritative eligible destinations, intersected with GWP's live topology
  // and model membership. Empty means no eligible destination.
  repeated string eligible_endpoint_ids = 3;
  // Empty means no additional worker restriction within eligible destinations.
  repeated uint64 allowed_worker_ids = 4 [packed = true];
  // Worker constraints use the same semantics as generation Routing.constraints.
  RoutingConstraints constraints = 5;
  // Empty means [PLACEMENT_VERSION_V1]. Return every requested version supported
  // by GWP; duplicates and unsupported versions are ignored. UNSPECIFIED is
  // invalid, and a request with no supported versions returns an error. Include
  // V1 when fallback to a V1-only server is acceptable.
  repeated PlacementVersion requested_placement_versions = 6 [packed = true];
}

enum PlacementVersion {
  PLACEMENT_VERSION_UNSPECIFIED = 0;
  PLACEMENT_VERSION_V1 = 1;
}

// V1 placement identity. Future incompatible versions use separate messages.
message Placement
{
  // Required shared destination ID; Alyx resolves it to a coordinator URL.
  string endpoint_id = 1;
  // Provisional prefill-bearing worker, including an aggregate worker. The
  // downstream admission reports actual prefill/decode workers and DP ranks.
  uint64 worker_id = 2;
  uint32 dp_rank = 3;
}

message LocateResponse
{
  // Present when V1 was requested (including the default) and evaluated. An
  // empty result means no eligible placements; absence means V1 was not returned.
  PlacementResultV1 placements_v1 = 1;
  // Future versions add independent message fields so a response can carry
  // multiple versions together, each with its own candidates and scores.
}

message PlacementResultV1
{
  // Every eligible endpoint/worker/DP-rank tuple in the lookup snapshot appears
  // exactly once. Includes all eligible workers across all eligible endpoints.
  // Ordered by increasing score, then endpoint_id (lexicographically), worker_id,
  // and dp_rank for ties. Empty means no eligible placement; a prefix-cache miss
  // can still produce candidates. The list is advisory and reserves no capacity.
  repeated LocateCandidate candidates = 1;
}

message LocateCandidate
{
  // Required destination and worker identity for this candidate.
  Placement placement = 1;
  // Required per-candidate load estimates. Affinity indicates that the existing
  // session binding matches this candidate, independent of Alyx's final choice.
  BidResponse estimate = 2;
  // Required finite GWP ranking cost after configured weights and preferences;
  // lower is better. Comparable only within the enclosing PlacementResultV1.
  // Presence is explicit because zero is a valid score.
  optional double score = 3;
  // Input tokens expected to be cached on this worker/rank, bounded by the bid's
  // token count. Zero indicates no estimated cache overlap.
  uint64 estimated_overlap_tokens = 4;
}

message CommitIntendRequest
{
  // Required UUID string. Mint a fresh ID per dispatch and reuse it only when
  // retrying that attempt's lifecycle notifications.
  string attempt_id = 1;
  // Required logical NewRequest.request_id, stable across dispatch retries.
  string request_id = 2;
  // Required full context so Commit does not depend on retained Locate state.
  LocateRequest input = 3;
  // Exactly one supported placement is required. It must satisfy input's
  // eligibility and constraints. Alyx may choose a returned candidate or an
  // eligible fallback; CommitIntend books only this placement. Missing or unknown
  // choices return an error. Servers must support a version before Alyx commits it.
  oneof chosen_placement
  {
    // V1 dispatch choice.
    Placement chosen = 4;
    // Future versions add their own choice fields here.
  }
}

message ResponseOpenOutcomeRequest
{
  // Same UUID string as CommitIntendRequest.attempt_id.
  string attempt_id = 1;
  // Exactly one outcome is required. A response is opened only when Alyx
  // receives a valid Admission frame, not merely an HTTP response. Completion,
  // cancellation, and failures after admission are reported via ResponseFinish.
  oneof outcome
  {
    // Nonterminal: the admitted response will later receive ResponseFinish.
    Admission admitted = 2;
    // Terminal, including when optional admission describes a completed prefill
    // leg before denial. Preserve that metadata; do not send ResponseFinish.
    DeniedGeneration denied = 3;
    // Terminal: no valid admission or denial was received. Includes connection
    // failure, timeout, or cancellation before admission; no ResponseFinish.
    OpenFailure failed = 4;
  }
}

message OpenFailure
{
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TRANSPORT = 1;
    PROTOCOL = 2;
    CANCELLED = 3;
    DEADLINE_EXCEEDED = 4;
  }
  // Required non-unspecified kind.
  Kind kind = 1;
  string message = 2;
}

// Terminal notification for a response that Alyx previously observed admitted.
message ResponseFinishRequest
{
  enum Reason {
    REASON_UNSPECIFIED = 0;
    COMPLETED = 1;
    CANCELLED = 2;
    FAILED = 3;
  }
  // Same UUID string as CommitIntendRequest.attempt_id.
  string attempt_id = 1;
  // Required non-unspecified reason describing the admitted response's end.
  Reason reason = 2;
}

message NewRequest
{
  repeated uint32 tokens = 1 [packed = true];
  optional MmRoutingArgs mm_routing_args = 2;
  optional Routing routing = 3;
  optional MmPayloads mm_payloads = 4;
  // Opaque worker map excluding tokens and mm_args. Preserve backend fields,
  // including unknown fields and MessagePack binary values, without projection.
  bytes worker_msgpack = 5;
  string request_id = 6;
  optional TraceContext trace_context = 7;
  map<string, string> metadata = 8;
}

message Routing
{
  optional string session_id = 1;
  bool do_not_queue = 2;
  double priority_jump = 3;
  uint32 priority_load_shed_percent = 4;
  repeated uint64 allowed_worker_ids = 5 [packed = true];
  optional RoutingConstraints constraints = 6;
  optional string cache_salt = 7;
}

message RoutingConstraints
{
  repeated string required_taints = 1;
  repeated WeightedTaint preferred_taints = 2;
}
message WeightedTaint
{
  string taint = 1;
  float weight = 2;
}

message MmRoutingArgs
{
  repeated MmRoutingBlock blocks = 1;
}
message MmRoutingBlock
{
  bool present = 1;
  repeated MmRoutingObject objects = 2;
}
message MmRoutingObject
{
  uint64 mm_hash = 1;
  repeated TokenRange offsets = 2;
}
message TokenRange
{
  uint64 start = 1;
  uint64 end = 2;
}

message MmPayloads
{
  repeated bytes embeddings = 1;
  repeated MmKwarg kwargs = 2;
  sint64 media_token_id = 3;
  repeated string hashes = 4;
  repeated uint64 positions = 5 [packed = true];
  repeated uint64 lengths = 6 [packed = true];
  repeated NativeMmInput native_inputs = 7;
}
message MmKwarg
{
  oneof value
  {
    bytes bytes = 1;
    string string = 2;
  }
}
message NativeMmInput
{
  string kind = 1;
  string url = 2;
}

message TraceContext
{
  string trace_id = 1;
  string span_id = 2;
  optional string parent_id = 3;
  optional string tracestate = 4;
  optional string x_request_id = 5;
  optional string request_id = 6;
}

message GenerationResponseFrame
{
  oneof frame
  {
    Admission admission = 1;
    DeniedGeneration denied = 2;
    bytes chunk_msgpack = 3;
    ProtocolError error = 4;
  }
}

message Admission
{
  uint64 estimated_overlap_tokens = 1;
  uint64 best_overlap_blocks = 2;
  uint64 prefill_worker_id = 3;
  uint32 prefill_dp_rank = 4;
  optional uint64 decode_worker_id = 5;
  optional uint32 decode_dp_rank = 6;
  optional uint64 prefill_duration_ms = 7;
}

message DeniedGeneration
{
  DeniedRequest denied = 1;
  optional Admission admission = 2;
}

message DeniedRequest
{
  enum Kind {
    KIND_UNSPECIFIED = 0;
    ROUTER_BACKPRESSURE = 1;
    REQUIRED_COMPONENTS_DOWN = 2;
    NEXT_ROUTER_UNREACHABLE = 3;
    PROTOCOL_ERROR = 4;
    CANCELLED = 5;
    FIRST_WORKER_EVENT_FAILED = 6;
    WORKER_ERROR_RESPONSE = 7;
  }
  Kind kind = 1;
  optional string reason = 2;
  optional string name = 3;
  optional string error = 4;
  optional string received = 5;
  uint64 queued_isl_tokens = 6;
  optional uint64 max_queued_isl_tokens = 7;
}

message ProtocolError
{
  string message = 1;
}
